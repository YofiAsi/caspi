services:
  db:
    container_name: caspi-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: caspi-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SCRAPER_URL: ${SCRAPER_URL}
      SPLITWISE_MANAGER_URL: http://splitwise-manager:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      scraper:
        condition: service_started
      splitwise-manager:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn caspi.interfaces.app:app --host 0.0.0.0 --port 8000 --reload"

  redis:
    container_name: caspi-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  splitwise-manager:
    container_name: caspi-splitwise-manager
    build:
      context: ./splitwise-manager
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      SW_CONSUMER_KEY: ${SW_CONSUMER_KEY:-}
      SW_CONSUMER_SECRET: ${SW_CONSUMER_SECRET:-}
      SW_API_KEY: ${SW_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./splitwise-manager/src:/app/src
      - ./splitwise-manager/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn splitwise_manager.main:app --host 0.0.0.0 --port 8001 --reload"

  splitwise-worker:
    container_name: caspi-splitwise-worker
    build:
      context: ./splitwise-manager
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      SW_CONSUMER_KEY: ${SW_CONSUMER_KEY:-}
      SW_CONSUMER_SECRET: ${SW_CONSUMER_SECRET:-}
      SW_API_KEY: ${SW_API_KEY:-}
    depends_on:
      splitwise-manager:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./splitwise-manager/src:/app/src
    command: celery -A splitwise_manager.tasks.celery_app worker --loglevel=info

  splitwise-beat:
    container_name: caspi-splitwise-beat
    build:
      context: ./splitwise-manager
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
    depends_on:
      splitwise-manager:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./splitwise-manager/src:/app/src
    command: celery -A splitwise_manager.tasks.celery_app beat --loglevel=info

  scraper:
    container_name: caspi-scraper
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
    volumes:
      - ./scraper/src:/app/src
    user: root
    command: node --watch src/index.js

  frontend:
    container_name: caspi-frontend
    image: node:20-slim
    working_dir: /app
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  frontend_node_modules:
