services:
  db:
    container_name: caspi-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app

  backend:
    container_name: caspi-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SCRAPER_URL: ${SCRAPER_URL}
      SPLITWISE_MANAGER_URL: http://splitwise-manager:8001
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      scraper:
        condition: service_started
      splitwise-manager:
        condition: service_started
    networks:
      - app

  redis:
    container_name: caspi-redis
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app

  splitwise-manager:
    container_name: caspi-splitwise-manager
    build:
      context: ./splitwise-manager
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      SW_CONSUMER_KEY: ${SW_CONSUMER_KEY:-}
      SW_CONSUMER_SECRET: ${SW_CONSUMER_SECRET:-}
      SW_API_KEY: ${SW_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app

  splitwise-worker:
    container_name: caspi-splitwise-worker
    build:
      context: ./splitwise-manager
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A splitwise_manager.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      SW_CONSUMER_KEY: ${SW_CONSUMER_KEY:-}
      SW_CONSUMER_SECRET: ${SW_CONSUMER_SECRET:-}
      SW_API_KEY: ${SW_API_KEY:-}
    depends_on:
      splitwise-manager:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - app

  splitwise-beat:
    container_name: caspi-splitwise-beat
    build:
      context: ./splitwise-manager
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A splitwise_manager.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
    depends_on:
      splitwise-manager:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - app

  scraper:
    container_name: caspi-scraper
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
    networks:
      - app

  frontend:
    container_name: caspi-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    driver: bridge